<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenRD 工作台</title>
  <style>
    :root {
      --black: #080808;
      --gray-800: #222222;
      --gray-700: #363636;
      --gray-500: #5a5a5a;
      --gray-300: #ababab;
      --border: #d8d8d8;
      --border-hover: #898989;
      --blue: #146ef5;
      --blue-300: #006acc;
      --blue-hover: #0055d4;
      --purple: #7a3dff;
      --pink: #ed52cb;
      --green: #00d722;
      --orange: #ff6b00;
      --yellow: #ffae13;
      --red: #ee1d36;
      --white: #ffffff;
      --shadow-cascade:
        rgba(0, 0, 0, 0) 0 84px 24px,
        rgba(0, 0, 0, 0.01) 0 54px 22px,
        rgba(0, 0, 0, 0.04) 0 30px 18px,
        rgba(0, 0, 0, 0.08) 0 13px 13px,
        rgba(0, 0, 0, 0.09) 0 3px 7px;
      font-family: "WF Visual Sans Variable", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--black);
      background:
        radial-gradient(circle at 12% 12%, rgba(20, 110, 245, 0.08), transparent 28%),
        radial-gradient(circle at 86% 18%, rgba(122, 61, 255, 0.065), transparent 24%),
        radial-gradient(circle at 80% 86%, rgba(255, 174, 19, 0.055), transparent 28%),
        linear-gradient(135deg, #ffffff 0%, #f7f9ff 100%);
      font-family: "WF Visual Sans Variable", Arial, sans-serif;
      font-weight: 500;
    }

    button { font: inherit; }

    .page-shell {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 96px 32px 32px;
    }

    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      min-height: 76px;
      padding: 0 32px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid rgba(216, 216, 216, 0.86);
      box-shadow: 0 18px 40px rgba(8, 8, 8, 0.08);
      backdrop-filter: blur(16px);
    }

    .top-nav-inner,
    .workbench-frame {
      width: min(1460px, 100%);
      margin: 0 auto;
    }

    .top-nav-inner {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 0;
    }

    .brand-row {
      display: inline-flex;
      align-items: center;
      gap: 12px;
    
      color: inherit;
      text-decoration: none;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      color: var(--white);
      background: var(--blue);
      border-radius: 4px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand-name {
      color: var(--black);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.2px;
    }

    .brand-caption {
      display: block;
      margin-top: 3px;
      color: var(--gray-500);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .primary-button,
    .ghost-button,
    .profile-button {
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 180ms ease, border-color 180ms ease, color 180ms ease;
    }

    .primary-button {
      padding: 0 18px;
      color: var(--white);
      background: var(--blue);
      border: 0;
    }

    .ghost-button {
      padding: 0 16px;
      color: var(--black);
      background: var(--white);
      border: 1px solid var(--border);
    }

    .primary-button:hover {
      color: var(--white);
      background: var(--blue-hover);
      box-shadow: 0 14px 28px rgba(20, 110, 245, 0.22);
      transform: translateX(6px);
    }

    .ghost-button:hover,
    .profile-button:hover {
      color: var(--blue);
      border-color: var(--blue);
      transform: translateX(6px);
    }

    .profile-button {
      gap: 10px;
      padding: 0 10px;
      color: var(--black);
      background: var(--white);
      border: 1px solid var(--border);
    }

    .avatar {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: var(--white);
      background: var(--black);
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
    }

    .profile-trigger { position: relative; }

    .profile-name {
      font-size: 14px;
      font-weight: 600;
    }

    .profile-card {
      cursor: pointer;
      position: absolute;
      top: calc(100% + 12px);
      right: 0;
      width: 260px;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-cascade);
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms ease;
    }

    .profile-trigger:hover .profile-card,
    .profile-trigger:focus-within .profile-card {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .profile-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid #ececec;
    }

    .profile-card h3 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.25;
    }

    .profile-card p {
      margin: 4px 0 0;
      color: var(--gray-500);
      font-size: 13px;
      line-height: 1.4;
    }

    .profile-meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .profile-meta div {
      padding: 10px;
      background: rgba(20, 110, 245, 0.06);
      border: 1px solid rgba(20, 110, 245, 0.12);
      border-radius: 4px;
    }

    .profile-meta span {
      display: block;
      color: var(--gray-500);
      font-size: 11px;
    }

    .profile-meta strong {
      display: block;
      margin-top: 4px;
      color: var(--black);
      font-size: 15px;
      font-weight: 600;
    }

    .logout-link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      margin-top: 12px;
      color: var(--red, #ee1d36);
      background: rgba(238, 29, 54, 0.08);
      border: 1px solid rgba(238, 29, 54, 0.18);
      border-radius: 4px;
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .logout-link:hover {
      background: rgba(238, 29, 54, 0.12);
      border-color: rgba(238, 29, 54, 0.34);
      transform: translateX(6px);
    }

    .hero-card,
    .info-card,
    .tile-card,
    .role-switcher {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(216, 216, 216, 0.86);
      border-radius: 8px;
      box-shadow: var(--shadow-cascade);
      backdrop-filter: blur(16px);
    }

    .workbench-frame {
      position: relative;
    }

    .ambient-ring,
    .ambient-node {
      position: absolute;
      pointer-events: none;
      z-index: -1;
    }

    .ambient-ring {
      width: 280px;
      height: 280px;
      right: -70px;
      top: 92px;
      border: 1px solid rgba(20, 110, 245, 0.1);
      border-radius: 50%;
    }

    .ambient-node {
      width: 140px;
      height: 70px;
      left: -48px;
      bottom: 84px;
      background:
        radial-gradient(circle at 8px 14px, rgba(20, 110, 245, 0.22) 0 4px, transparent 5px),
        radial-gradient(circle at 72px 38px, rgba(0, 215, 34, 0.18) 0 5px, transparent 6px),
        radial-gradient(circle at 128px 16px, rgba(237, 82, 203, 0.18) 0 4px, transparent 5px),
        linear-gradient(18deg, transparent 0 16px, rgba(20, 110, 245, 0.08) 17px 18px, transparent 19px 100%);
    }

    .hero-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 22px;
      align-items: center;
      padding: 24px;
    }

    .section-label {
      margin: 0 0 10px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      line-height: 1.3;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--black);
      font-size: clamp(40px, 5vw, 58px);
      font-weight: 600;
      line-height: 1.04;
      letter-spacing: -0.8px;
    }

    .hero-copy {
      max-width: 720px;
      margin: 14px 0 0;
      color: var(--gray-500);
      font-size: 16px;
      line-height: 1.58;
    }

    .role-switcher {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px;
      box-shadow: none;
    }

    .role-button {
      height: 38px;
      padding: 0 14px;
      color: var(--gray-500);
      background: transparent;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .role-button.is-active {
      color: var(--white);
      background: var(--blue);
      box-shadow: 0 10px 20px rgba(20, 110, 245, 0.18);
    }

    .info-section {
      margin-top: 18px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .info-card {
      position: relative;
      min-height: 132px;
      overflow: hidden;
      padding: 18px;
    }

    .info-card::after {
      content: "";
      position: absolute;
      width: 104px;
      height: 104px;
      right: -42px;
      top: -48px;
      border-radius: 50%;
      background: var(--tone, rgba(20, 110, 245, 0.1));
    }

    .info-value {
      position: relative;
      z-index: 1;
      display: block;
      color: var(--black);
      font-size: 40px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.8px;
    }

    .info-title {
      position: relative;
      z-index: 1;
      display: block;
      margin-top: 12px;
      color: var(--gray-800);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
    }

    .info-note {
      position: relative;
      z-index: 1;
      display: block;
      margin-top: 12px;
      color: var(--gray-500);
      font-size: 13px;
      line-height: 1.45;
    }

    .tile-section {
      margin-top: 18px;
    }

    .section-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
    }

    .section-heading h2 {
      margin: 0;
      color: var(--black);
      font-size: 32px;
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -0.5px;
    }

    .section-heading p {
      max-width: 460px;
      margin: 0;
      color: var(--gray-500);
      font-size: 14px;
      line-height: 1.55;
      text-align: right;
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .tile-card {
      min-height: 164px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
      cursor: pointer;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .tile-card:hover {
      border-color: var(--blue);
      box-shadow: 0 18px 36px rgba(20, 110, 245, 0.14);
      transform: translateX(6px);
    }

    .tile-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .tile-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: var(--icon-color, var(--blue));
      background: var(--icon-bg, rgba(20, 110, 245, 0.1));
      border-radius: 4px;
      font-size: 18px;
      font-weight: 800;
    }

    .tile-badge {
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      padding: 0 9px;
      color: var(--blue);
      background: rgba(20, 110, 245, 0.08);
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .tile-title {
      margin: 20px 0 0;
      color: var(--black);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.25;
    }

    .tile-desc {
      margin: 8px 0 0;
      color: var(--gray-500);
      font-size: 14px;
      line-height: 1.5;
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 60;
      max-width: min(360px, calc(100vw - 48px));
      padding: 14px 16px;
      color: var(--black);
      background: #fff;
      border: 1px solid rgba(20, 110, 245, 0.18);
      border-radius: 8px;
      box-shadow: var(--shadow-cascade);
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: opacity 180ms ease, transform 180ms ease, visibility 180ms ease;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.45;
    }

    .toast.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    @media (max-width: 1100px) {
      .hero-card,
      .info-grid,
      .tile-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .role-switcher {
        justify-self: start;
      }
    }

    @media (max-width: 900px) {
      body { background: var(--white); }
      .page-shell { padding: 132px 0 0; }
      .top-nav-inner {
        align-items: flex-start;
        flex-direction: column;
        padding: 16px 0;
      }
      .nav-actions {
        width: 100%;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .workbench-frame { min-height: 100vh; }
      .hero-card,
      .info-card,
      .tile-card {
        border-radius: 0;
        box-shadow: none;
      }
      .hero-card,
      .info-grid,
      .tile-grid {
        grid-template-columns: 1fr;
      }
      .hero-card { padding: 22px; }
      .section-heading {
        align-items: flex-start;
        flex-direction: column;
      }
      .section-heading p { text-align: left; }
      .ambient-ring,
      .ambient-node { display: none; }
    }

    @media (max-width: 520px) {
      .page-shell { padding-top: 148px; }
      .top-nav { padding-left: 16px; padding-right: 16px; }
      .ghost-button,
      .profile-button { width: 100%; }
      .nav-actions > * { flex: 1; }
      h1 { font-size: 36px; }
      .section-heading h2 { font-size: 28px; }
      .role-switcher { width: 100%; }
      .role-button { flex: 1; }
    }
  </style>
</head>
<body>
  <nav class="top-nav" aria-label="平台导航">
    <div class="top-nav-inner">
      <a class="brand-row" href="./home.html" aria-label="返回社区主页">
        <div class="brand-mark">RD</div>
        <div>
          <div class="brand-name">OpenRD 开源社区协作平台</div>
          <span class="brand-caption">Rare Disease Open Collaboration</span>
        </div>
      </a>
      <div class="nav-actions">
        <button class="ghost-button nav-back-button" type="button" onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.href='./workbench.html'; }">返回</button>
        <a class="ghost-button" href="./home.html">前往大厅</a>
        <a class="primary-button" href="./home.html">平台首页</a>
        <a class="ghost-button" href="./workbench.html">工作台</a>
        <div class="profile-trigger">
          <button class="profile-button" type="button" aria-label="个人信息">
            <span class="avatar">顾</span>
            <span class="profile-name">顾星河</span>
          </button>
          <section class="profile-card" aria-label="个人信息卡片" role="link" tabindex="0" title="进入个人信息页" onclick="if(!event.target.closest('a')) window.location.href='./profile.html'" onkeydown="if(!event.target.closest('a') && (event.key==='Enter'||event.key===' ')){event.preventDefault();window.location.href='./profile.html'}">
            <div class="profile-card-header">
              <span class="avatar">顾</span>
              <div>
                <h3>顾星河</h3>
                <p>超级管理员 · 平台治理负责人 · 北京</p>
              </div>
            </div>
            <div class="profile-meta">
              <div><span>贡献积分</span><strong>1,280</strong></div>
              <div><span>参与任务</span><strong>12</strong></div>
              <div><span>角色等级</span><strong>中级</strong></div>
              <div><span>初始化</span><strong>已完成</strong></div>
            </div>
              <a class="logout-link" href="./login.html" onclick="event.stopPropagation()">退出登录</a>

          </section>
        </div>
      </div>
    </div>
  </nav>

  <main class="page-shell">
    <div class="workbench-frame">
      <div class="ambient-ring"></div>
      <div class="ambient-node"></div>

      <section class="hero-card" aria-label="工作台角色切换">
        <div>
          <p class="section-label">Workbench</p>
          <h1 id="roleTitle">需求者工作台</h1>
          <p class="hero-copy" id="roleDescription">聚焦你提交的需求进度，快速查看审核、转化与参与工单状态。</p>
        </div>
        <div class="role-switcher" role="tablist" aria-label="角色切换">
          <button class="role-button is-active" type="button" data-role="superAdmin" aria-selected="true">超管体验</button>
        </div>
      </section>

      <section class="info-section" aria-label="信息区">
        <div class="info-grid" id="infoGrid"></div>
      </section>

      <section class="tile-section" aria-label="功能区">
        <div class="section-heading">
          <div>
            <p class="section-label">Function Tiles</p>
            <h2>功能区</h2>
          </div>
          <p id="tileSummary">根据你的角色权限展示可用功能。</p>
        </div>
        <div class="tile-grid" id="tileGrid"></div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">已进入功能</div>

  <script src="./local-data.js"></script>
  <script>
    const superAdminDemo = window.OpenRDSuperAdminDemo?.load?.();
    const roleData = {
      requester: {
        title: '需求者工作台',
        description: '聚焦你提交的需求进度，快速查看审核、转化与参与工单状态。',
        tileSummary: '需求者仅展示与自身需求相关的功能入口。',
        metrics: [
          { title: '我的需求总数', value: '12', note: '其中待审核 3 个', tone: 'rgba(20, 110, 245, 0.1)' },
          { title: '已转化的需求数', value: '5', note: '已进入开发流程', tone: 'rgba(0, 215, 34, 0.12)' },
          { title: '平台累计完成工单数', value: '74', note: '仅展示，增强协作信心', tone: 'rgba(255, 174, 19, 0.16)' },
          { title: '我参与的工单数', value: '3', note: '进行中 1 / 已完成 2', tone: 'rgba(122, 61, 255, 0.1)' },
        ],
        tiles: ['profile', 'messageCenter', 'myDemands'],
      },
      builder: {
        title: '共建者工作台',
        description: '快速处理自己参与的任务、队伍申请与需要关注的需求。',
        tileSummary: '共建者功能区聚焦个人任务和个人需求。',
        metrics: [
          { title: '我是队长的工单数', value: '4', note: '2 个正在招募成员', tone: 'rgba(20, 110, 245, 0.1)' },
          { title: '待我处理的申请数', value: '7', note: '队长专用，来自成员加入申请', tone: 'rgba(255, 174, 19, 0.16)' },
          { title: '待审核需求数', value: '9', note: '高亮提醒，需紧急处理', tone: 'rgba(238, 29, 54, 0.1)' },
        ],
        tiles: ['profile', 'messageCenter', 'myTasks', 'myDemands'],
      },
      operator: {
        title: '运营管理员工作台',
        description: '关注需求审核、任务流转和平台整体运营效率。',
        tileSummary: '运营管理员可管理任务和需求，也保留个人任务/需求入口。',
        metrics: [
          { title: '本月转化率', value: '62%', note: '已转化需求 / 总审核数', tone: 'rgba(0, 215, 34, 0.12)' },
          { title: '全部进行中工单数', value: '36', note: '含招募、开发、验收阶段', tone: 'rgba(20, 110, 245, 0.1)' },
          { title: '平台总注册用户数', value: '680', note: '患者/家属 268 · 志愿者 412', tone: 'rgba(122, 61, 255, 0.1)' },
        ],
        tiles: ['profile', 'messageCenter', 'taskManage', 'demandManage', 'myTasks', 'myDemands'],
      },
      superAdmin: {
        title: '超级管理员工作台',
        description: superAdminDemo?.role?.definition || '面向全局治理、权限配置、审计追踪和核心运营指标。',
        tileSummary: '超级管理员可访问全部核心管理入口。',
        metrics: [
          { title: '今日活跃用户数', value: String(superAdminDemo?.governance?.activeUsers || 148), note: 'DAU，较昨日 +12%', tone: 'rgba(20, 110, 245, 0.1)' },
          { title: '近 7 天新增需求数', value: '31', note: '含待审核与已转化需求', tone: 'rgba(255, 174, 19, 0.16)' },
          { title: '待复核风险事件', value: String(superAdminDemo?.governance?.pendingRiskEvents || 5), note: '来自系统日志与权限变更', tone: 'rgba(238, 29, 54, 0.1)' },
        ],
        tiles: ['profile', 'messageCenter', 'userManage', 'permissionManage', 'systemLog', 'taskManage', 'demandManage', 'myTasks', 'myDemands'],
      },
    };

    const tileCatalog = {
      userManage: { title: '用户管理', desc: '查看、禁用、重置用户状态。', badge: 'Admin', icon: 'U', color: '#146ef5', bg: 'rgba(20, 110, 245, 0.1)', href: './user-management.html' },
      permissionManage: { title: '权限管理', desc: '配置角色权限与菜单访问范围。', badge: 'Role', icon: 'P', color: '#7a3dff', bg: 'rgba(122, 61, 255, 0.1)', href: './permission-management.html' },
      systemLog: { title: '系统日志', desc: '审计敏感操作和异常行为。', badge: 'Log', icon: 'L', color: '#ee1d36', bg: 'rgba(238, 29, 54, 0.1)', href: './system-log.html' },
      profile: { title: '个人信息', desc: '查看并维护头像、手机号、职业与擅长领域。', badge: 'Me', icon: 'I', color: '#146ef5', bg: 'rgba(20, 110, 245, 0.1)', href: './profile.html' },
      messageCenter: { title: '消息中心', desc: '查看系统通知、任务进度、需求反馈和队伍申请。', badge: 'Msg', icon: 'N', color: '#7a3dff', bg: 'rgba(122, 61, 255, 0.1)', href: './message-center.html' },
      taskManage: { title: '任务管理', desc: '管理全量任务、状态与关闭操作。', badge: 'Task', icon: 'T', color: '#ff6b00', bg: 'rgba(255, 107, 0, 0.1)', href: './task-management.html' },
      demandManage: { title: '需求管理', desc: '审核、编辑并转化用户需求。', badge: 'Need', icon: 'D', color: '#ffae13', bg: 'rgba(255, 174, 19, 0.16)', href: './demand-management.html' },
      myTasks: { title: '我的任务', desc: '查看我参与、负责或待处理的任务。', badge: 'Mine', icon: 'M', color: '#00a91b', bg: 'rgba(0, 215, 34, 0.12)', href: './my-tasks.html' },
      myDemands: { title: '我的需求', desc: '查看我提交的需求与当前状态。', badge: 'Self', icon: 'R', color: '#ed52cb', bg: 'rgba(237, 82, 203, 0.1)', href: './my-demands.html' },
    };

    const roleButtons = Array.from(document.querySelectorAll('.role-button'));
    const roleTitle = document.querySelector('#roleTitle');
    const roleDescription = document.querySelector('#roleDescription');
    const infoGrid = document.querySelector('#infoGrid');
    const tileGrid = document.querySelector('#tileGrid');
    const tileSummary = document.querySelector('#tileSummary');
    const toast = document.querySelector('#toast');
    let toastTimer = null;

    const showToast = (message) => {
      toast.textContent = message;
      toast.classList.add('is-visible');
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 2200);
    };

    const renderMetrics = (metrics) => {
      infoGrid.innerHTML = metrics.map((metric) => `
        <article class="info-card" style="--tone: ${metric.tone}">
          <span class="info-value">${metric.value}</span>
          <span class="info-title">${metric.title}</span>
          <span class="info-note">${metric.note}</span>
        </article>
      `).join('');
    };

    const renderTiles = (tileKeys) => {
      tileGrid.innerHTML = tileKeys.map((key) => {
        const tile = tileCatalog[key];
        return `
          <article class="tile-card" data-title="${tile.title}" data-href="${tile.href}">
            <div class="tile-top">
              <span class="tile-icon" style="--icon-color: ${tile.color}; --icon-bg: ${tile.bg}">${tile.icon}</span>
              <span class="tile-badge">${tile.badge}</span>
            </div>
            <div>
              <h3 class="tile-title">${tile.title}</h3>
              <p class="tile-desc">${tile.desc}</p>
            </div>
          </article>
        `;
      }).join('');

      tileGrid.querySelectorAll('.tile-card').forEach((tile) => {
        tile.addEventListener('click', () => {
          showToast(`已进入：${tile.dataset.title}`);
          window.setTimeout(() => { window.location.href = tile.dataset.href; }, 260);
        });
      });
    };

    const renderRole = (roleKey) => {
      const data = roleData[roleKey];
      roleTitle.textContent = data.title;
      roleDescription.textContent = data.description;
      tileSummary.textContent = data.tileSummary;
      renderMetrics(data.metrics);
      renderTiles(data.tiles);

      roleButtons.forEach((button) => {
        const isActive = button.dataset.role === roleKey;
        button.classList.toggle('is-active', isActive);
        button.setAttribute('aria-selected', String(isActive));
      });
    };

    roleButtons.forEach((button) => {
      button.addEventListener('click', () => renderRole(button.dataset.role));
    });

    renderRole('superAdmin');
  </script>
</body>
</html>
