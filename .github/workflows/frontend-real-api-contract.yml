name: Frontend real API contract

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-real-api-contract.yml'
  push:
    branches:
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-real-api-contract.yml'

jobs:
  real-api-default:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_ENABLE_MOCK: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:contract
      - run: npm run build-only
      - run: npm run test:bundle-contract
